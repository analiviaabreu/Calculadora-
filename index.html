<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>
    <div class="fundo">
        <h1>criado por Ana Lívia </h1>
          <div class="Calculadora">
            <h1>Calculadora</h1>
             <P id="Resultado"></P>
                <table>
                       
                    <tr>
                      <td><button class="botao" onclick="clean()">C</button></td>
                      <td><button class="botao" onclick="back()"><</button></td>
                      <td><button class="botao" onclick="insert('/')">/</button></td>
                      <td><button class="botao" onclick="insert('*')">x</button></td>
                    </tr>
                 <tr>

                      <td><button class="botao" onclick="insert('7')">7</button></td>
                      <td><button class="botao" onclick="insert('8')">8</button></td>
                      <td><button class="botao" onclick="insert('9')">9</button></td>
                      <td><button class="botao" onclick="insert(-)">-</button></td>

                 </tr>
                 <tr>

                      <td><button class="botao" onclick="">4</button></td>
                      <td><button class="botao" onclick="">5</button></td>
                      <td><button class="botao" onclick="">6</button></td>
                      <td><button class="botao" onclick="">+</button></td>
                 </tr>
                 <tr>

                      <td><button class="botao" onclick="">1</button></td>
                      <td><button class="botao" onclick="">2</button></td>
                      <td><button class="botao" onclick="">3</button></td>
                      <td rowspan="2"><button class="botao" style="height: 106px;" onclick="calcular()">=</button></td>
                    </tr>
                    <tr>
                        <td colspan="2"><button class="botao" style="width: 106px;" onclick="">0</button></td>
                    </tr>
               </table>
            </div>
        </div>
<script src="script.js"></script>
</body>
</html>
